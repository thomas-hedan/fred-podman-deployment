# Généré depuis Fred 32e5346db412df63fa95a9870087439975f0d487 par mock-full-deployment/scripts/export-templates.py
app:
  gcu_version: v1
  team_admin_charter_version: v1
  name: Control Plane Backend
  base_url: /control-plane/v1
  address: 0.0.0.0
  port: 8222
  log_level: info
  log_format: text
  default_team_max_resources_storage_size: 5368709120
  personal_max_resources_storage_size: 5368709120
  bootstrap_token_env_var: FRED_BOOTSTRAP_TOKEN
scheduler:
  enabled: true
  backend: temporal
  temporal:
    host: temporal:7233
    namespace: default
    task_queue: control-plane-lifecycle
    workflow_id_prefix: control-plane
    connect_timeout_seconds: 5
observability:
  kpi:
    prometheus:
      address: 0.0.0.0
      port: 9222
security:
  profile: c3
  m2m:
    enabled: true
    provider: oidc
    realm_url: https://login.microsoftonline.com/${TENANT_ID}/v2.0
    client_id: ${CP_CLIENT_ID}
    scope: ${API_URI}/.default
    secret_env_var: KEYCLOAK_CONTROL_PLANE_CLIENT_SECRET
  user:
    enabled: true
    provider: oidc
    realm_url: https://login.microsoftonline.com/${TENANT_ID}/v2.0
    client_id: ${UI_CLIENT_ID}
    audience: ${API_APP_ID}
    scope: ${API_URI}/access_as_user
    roles_claim:
    - roles
    claims:
      uid: oid
  authorized_origins:
  - ${PUBLIC_URL}
  rebac:
    enabled: true
    type: openfga
    api_url: http://openfga:8080
  delegation:
    act_for_people: false
    accept_delegated_calls: true
    caller_roles_claim:
    - roles
    audience: ${API_APP_ID}
    service_accounts_only: false
  user_directory: local
storage:
  postgres:
    host: ${STO_FQDN}
    port: 5432
    database: fred
    username: fred
  content_storage:
    type: minio
    endpoint: https://${STO_FQDN}:8333
    access_key: ${S3_ACCESS_KEY}
    bucket_name: control-plane-content
    secure: true
  log_store:
    type: in_memory
knowledge_bases:
  publishers:
  - client_id: kb-fred.samples
    prefix: fred.samples
  run_max_attempts: 2
policies:
  purge_catalog_path: /etc/fred/config/conversation_policy_catalog.yaml
platform:
  frontend:
    feature_flags:
      enableInformationSystems: false
      enableApplications: false
  knowledge_flow_base_url: http://knowledge-flow-backend:8111/knowledge-flow/v1
  runtime_catalog_sources:
  - runtime_id: fred-agents
    base_url: http://fred-agents:8000/fred/agents/v2
    enabled: true
    ingress_prefix: /fred/agents/v2
  application_sources: []
